version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/wunderkennd/kaizen-rosetta/gen/go
    - file_option: java_package_prefix
      value: com.wunderkennd.kaizen.proto
plugins:
  # Go (connect-go for services, protobuf for messages)
  - remote: buf.build/protocolbuffers/go:v1.36.11
    revision: 1
    out: gen/go
    opt: paths=source_relative
    include_imports: true
  - remote: buf.build/connectrpc/go:v1.20.0
    revision: 1
    out: gen/go
    opt: paths=source_relative
    include_imports: true

  # TypeScript (connect-web)
  - remote: buf.build/bufbuild/es:v2.12.1
    revision: 1
    out: gen/ts
    opt: target=ts
    include_imports: true

  # Python (Google Protobuf messages and ConnectRPC services)
  - remote: buf.build/protocolbuffers/python:v33.5
    revision: 1
    out: gen/python
    include_imports: true
  - remote: buf.build/protocolbuffers/pyi:v33.5
    revision: 1
    out: gen/python
    include_imports: true
  - remote: buf.build/connectrpc/py:v0.11.0
    revision: 1
    out: gen/python
    opt: protobuf=google
