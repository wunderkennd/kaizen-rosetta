name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.66.0

      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: 1.46.0

      - name: Run deterministic checks
        run: just check

      - name: Build descriptor and digest
        run: just descriptor

      - name: Check breaking changes
        env:
          BUF_BREAKING_AGAINST: buf.build/kaizen/rosetta
        run: just breaking

      - name: Upload descriptor artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rosetta-descriptor
          path: |
            dist/rosetta-descriptor.binpb
            dist/rosetta-descriptor.sha256
          if-no-files-found: error
