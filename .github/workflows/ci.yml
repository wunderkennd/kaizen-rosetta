name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.66.0

      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: 1.46.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic checks and release-manifest builder fixtures
        # This released commit is test input only. No candidate manifest is
        # created until a release supplies the BSR commit returned by buf push.
        env:
          RELEASE_MANIFEST_TEST_BSR_COMMIT: 3d978f388d4242f3b3c8e663465b85fd
        run: just check

      - name: Generate contracts
        run: just generate

      - name: Run Python contract tests
        run: just python-contracts

      - name: Build descriptor and digest
        run: just descriptor

      - name: Check breaking changes
        env:
          BUF_BREAKING_AGAINST: buf.build/kaizen/rosetta
        run: just breaking

      - name: Upload descriptor artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rosetta-descriptor
          path: |
            dist/rosetta-descriptor.binpb
            dist/rosetta-descriptor.sha256
          if-no-files-found: error
