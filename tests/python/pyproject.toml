[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-python-contract-tests"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "connectrpc==0.11.0",
  "protobuf==6.33.6",
  "pytest==8.4.2",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["../../gen/python"]
testpaths = ["."]
